
# Generic JVM build mode for testing a custom JDK (e.g. JDK 26) until official
# images exist. Plain images only: no CRIU/AOT checkpointing, no JIT server.
#
# Two knobs (both overridable via -S or run.sh flags):
# - JAVA_VERSION: host JDK (sdkman id) running the Maven build. Any JDK 21+
#   works; it is NOT the benchmarked runtime.
# - RUNTIME_BASE_IMAGE: container base image providing the benchmarked JDK.
# Runtime JVM flags are passed with -S JAVA_OPTS_APPEND="..." (no repo change).
#
# Usage:
# ./run.sh jdk26.build get-all-heroes hyperfoil local

globals:
  javascript: |
    // returns the maven modules to build in according to the enabled services
    function getProjects(heroes, villains, locations, fights){
      const projects = ["rest-heroes", "rest-villains", "grpc-locations", "rest-fights"]
      const mask = [heroes, villains, locations, fights]
      return projects.filter((_, index) => mask[index]).join(",");;
    }

scripts:

  clone-superheroes:
  # clone the repository and checkout the proper commit/branch
  - sh: if [ -d ${{SUPERHEROES_BUILD_FOLDER}} ]; then rm -rf ${{SUPERHEROES_BUILD_FOLDER}}; fi
  - sh: git clone --quiet --depth 1 ${{SUPERHEROES_BUILD_REPO}} ${{SUPERHEROES_BUILD_FOLDER}}
  - sh: cd ${{SUPERHEROES_BUILD_FOLDER}} && git fetch --depth 1 origin ${{SUPERHEROES_BUILD_COMMIT:main}} && git checkout ${{SUPERHEROES_BUILD_COMMIT:main}}

  prepare-images:
  - log: building plain JVM images with custom JDK..
  - script: clone-superheroes
  # override Dockerfiles with the plain custom-JDK ones from modes/assets/jdk26
  - upload: ${{ENV.SCRIPT_DIR}}/assets/jdk26/Dockerfile.heroes /tmp
  - upload: ${{ENV.SCRIPT_DIR}}/assets/jdk26/Dockerfile.villains /tmp
  - upload: ${{ENV.SCRIPT_DIR}}/assets/jdk26/Dockerfile.locations /tmp
  - upload: ${{ENV.SCRIPT_DIR}}/assets/jdk26/Dockerfile.fights /tmp
  - upload: ${{ENV.SCRIPT_DIR}}/assets/jdk26/entrypoint.sh /tmp

  - sh: cd ${{SUPERHEROES_BUILD_FOLDER}}

  - sh: echo $'\n!src/main/docker' >> rest-heroes/.dockerignore
  - sh: yes | cp /tmp/Dockerfile.heroes rest-heroes/src/main/docker/Dockerfile.jvm
  - sh: yes | cp /tmp/entrypoint.sh rest-heroes/src/main/docker/entrypoint.sh

  - sh: echo $'\n!src/main/docker' >> rest-villains/.dockerignore
  - sh: yes | cp /tmp/Dockerfile.villains rest-villains/src/main/docker/Dockerfile.jvm
  - sh: yes | cp /tmp/entrypoint.sh rest-villains/src/main/docker/entrypoint.sh

  - sh: echo $'\n!src/main/docker' >> grpc-locations/.dockerignore
  - sh: yes | cp /tmp/Dockerfile.locations grpc-locations/src/main/docker/Dockerfile.jvm
  - sh: yes | cp /tmp/entrypoint.sh grpc-locations/src/main/docker/entrypoint.sh

  - sh: echo $'\n!src/main/docker' >> rest-fights/.dockerignore
  - sh: yes | cp /tmp/Dockerfile.fights rest-fights/src/main/docker/Dockerfile.jvm
  - sh: yes | cp /tmp/entrypoint.sh rest-fights/src/main/docker/entrypoint.sh

  - queue-download: /tmp/superheroes.build.log
  - script: sdk-select-java
    with:
      JAVA_VERSION: ${{JAVA_VERSION}}

  # NB: set -o pipefail so failures before | tee abort the run instead of
  # being masked by tee's exit code
  - sh: >
      set -o pipefail;
      ./mvnw --no-transfer-progress clean package -DskipTests
      -Dmaven.compiler.release=21
      -Dquarkus.http.host=0.0.0.0
      -pl ${{= getProjects( ${{HEROES_ENABLED}}, ${{VILLAINS_ENABLED}}, ${{LOCATIONS_ENABLED}}, ${{FIGHTS_ENABLED}} )}} | tee /tmp/superheroes.build.log
  - sh: >
      if ${{HEROES_ENABLED}}; then
        set -o pipefail;
        ${{CONTAINER_RUNTIME}} build -f ./rest-heroes/src/main/docker/Dockerfile.jvm --build-arg=BASE_IMAGE=${{RUNTIME_BASE_IMAGE}} ${{CONTAINER_RUNTIME_PARAMS}} -t quay.io/quarkus-super-heroes/rest-heroes:${{SUPERHEROES_CUSTOM_TAG}} ./rest-heroes/ | tee -a /tmp/superheroes.build.log;
      fi
  - sh: >
      if ${{VILLAINS_ENABLED}}; then
        set -o pipefail;
        ${{CONTAINER_RUNTIME}} build -f ./rest-villains/src/main/docker/Dockerfile.jvm --build-arg=BASE_IMAGE=${{RUNTIME_BASE_IMAGE}} ${{CONTAINER_RUNTIME_PARAMS}} -t quay.io/quarkus-super-heroes/rest-villains:${{SUPERHEROES_CUSTOM_TAG}} ./rest-villains/ | tee -a /tmp/superheroes.build.log;
      fi
  - sh: >
      if ${{LOCATIONS_ENABLED}}; then
        set -o pipefail;
        ${{CONTAINER_RUNTIME}} build -f ./grpc-locations/src/main/docker/Dockerfile.jvm --build-arg=BASE_IMAGE=${{RUNTIME_BASE_IMAGE}} ${{CONTAINER_RUNTIME_PARAMS}} -t quay.io/quarkus-super-heroes/grpc-locations:${{SUPERHEROES_CUSTOM_TAG}} ./grpc-locations/ | tee -a /tmp/superheroes.build.log;
      fi
  - sh: >
      if ${{FIGHTS_ENABLED}}; then
        set -o pipefail;
        ${{CONTAINER_RUNTIME}} build -f ./rest-fights/src/main/docker/Dockerfile.jvm --build-arg=BASE_IMAGE=${{RUNTIME_BASE_IMAGE}} ${{CONTAINER_RUNTIME_PARAMS}} -t quay.io/quarkus-super-heroes/rest-fights:${{SUPERHEROES_CUSTOM_TAG}} ./rest-fights/ | tee -a /tmp/superheroes.build.log;
      fi

  # override images
  - set-state: HEROES_REST_IMAGE "quay.io/quarkus-super-heroes/rest-heroes:${{SUPERHEROES_CUSTOM_TAG}}"
  - set-state: VILLAINS_REST_IMAGE "quay.io/quarkus-super-heroes/rest-villains:${{SUPERHEROES_CUSTOM_TAG}}"
  - set-state: LOCATIONS_GRPC_IMAGE "quay.io/quarkus-super-heroes/grpc-locations:${{SUPERHEROES_CUSTOM_TAG}}"
  - set-state: FIGHTS_REST_IMAGE "quay.io/quarkus-super-heroes/rest-fights:${{SUPERHEROES_CUSTOM_TAG}}"

  - signal: SUPERHEROES_IMAGES_BUILD_COMPLETED


states:
  MAP_USER_GROUP: false

  SUPERHEROES_BUILD_REPO: https://github.com/quarkusio/quarkus-super-heroes.git
  SUPERHEROES_BUILD_COMMIT: main
  SUPERHEROES_BUILD_FOLDER: /tmp/build-quarkus-super-heroes

  SUPERHEROES_CUSTOM_TAG: jdk26

  CONTAINER_RUNTIME_PARAMS:

  # host JDK running the Maven build (any 21+); NOT the benchmarked runtime
  JAVA_VERSION: 25.0.4-tem

  # container base image providing the benchmarked JDK
  RUNTIME_BASE_IMAGE: docker.io/library/eclipse-temurin:26-jdk
