scripts:
  wait-for-all-containers:
    # Core monitoring services are always started
    - wait-for: JAEGER_READY
    - wait-for: OTEL_READY

    # Conditionally wait for JIT Server
    - js: ${{JIT_SERVER_ENABLED}}
      then:
        - wait-for: JIT_SERVER_READY

    # Conditionally wait for Heroes
    - js: ${{HEROES_ENABLED}}
      then:
        - wait-for: HEROES_REST_READY

    # Conditionally wait for Villains
    - js: ${{VILLAINS_ENABLED}}
      then:
        - wait-for: VILLAINS_REST_READY

    # Conditionally wait for Locations
    - js: ${{LOCATIONS_ENABLED}}
      then:
        - wait-for: LOCATIONS_REST_READY

    # Conditionally wait for Fights
    - js: ${{FIGHTS_ENABLED}}
      then:
        - wait-for: FIGHTS_REST_READY

hosts:
  sut: ${{SUT_SERVER}}
  datasource: ${{DS_SERVER}}
  driver: ${{LOAD_DRIVER_SERVER}}

roles:
  datasource:
    hosts:
      - datasource
    setup-scripts:
      - remove-stale-datasources
      - infer-datasource-hostnames
      - prepare-superheroes
      - start-jaeger
      - start-otel
      - start-heroes-db
      - start-villains-db
      - start-locations-db
      - start-fights-db
      - start-apicurio
      - start-kafka
    cleanup-scripts:
      - cleanup-datasources

  sut:
    hosts:
      - sut
    setup-scripts:
      - remove-stale-superheroes
      - start-jit-server
      - prepare-images # should be exposed by script files in /modes folder
      - infer-datasource-hostnames
      - infer-services-hostnames
      - start-heroes-rest
      - start-villains-rest
      - start-locations-grpc
      - start-fights-rest
      - start-fights-ui
    cleanup-scripts:
      - cleanup-superheroes

  # all these scripts must be exposed by script files in /drivers folder
  driver:
    hosts:
      - driver
    setup-scripts:
      - setup-driver
      - wait-for-all-containers
    run-scripts:
      - run-benchmark
    cleanup-scripts:
      - cleanup-driver

  profiler:
    hosts:
      - sut
    setup-scripts:
      - app-prof-setup
    run-scripts:
      - run-pidstat
      - run-vmstat
      - run-mpstat
      - run-pmap
      - run-strace
      - run-perfstat
    cleanup-scripts:
      - export-metrics
      - cleanup-profiling

states:
